name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://careerpilot:careerpilot@localhost:5432/careerpilot_test
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to be ready
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Check /health
        run: curl -fsS http://localhost:8000/health
      - name: Check the web app, and /ready through its proxy
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:5173/ > /dev/null && curl -fsS http://localhost:5173/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Run the sample job through the worker
        run: |
          job_id=$(docker compose exec -T api python -m app.cli enqueue-sample | jq -r .job_id)
          for _ in $(seq 1 30); do
            output=$(docker compose exec -T api python -m app.cli job-status "$job_id")
            echo "$output"
            [ "$(echo "$output" | jq -r .status)" = "succeeded" ] && exit 0
            sleep 1
          done
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
